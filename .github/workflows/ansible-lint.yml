name: Ansible Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible ansible-core ansible-lint

      - name: Lint playbooks
        run: ansible-lint playbooks/*.yml roles/*/tasks/*.yml
