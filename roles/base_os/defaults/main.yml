variables:
  lan_interface: "eth1"
  wan_interface: "eth0"
  lan_subnet: "192.168.10.0/24"
  lan_ip: "192.168.10.1"
  lan_cidr: "24"
  deployment_mode: "minimal"   # minimal | full
  monitoring_mode: "lightweight" # lightweight | full
  default_timezone: "Australia/Sydney"
  ssh_port: 22
  docker_compose_dir: "/opt/pi-gateway"
  docker_compose_file: "{{ docker_compose_dir }}/docker-compose.yml"
  pihole_password: ""
  pihole_upstream_dns: "1.1.1.1"
  tailscale_auth_key: ""
  tailscale_hostname: "pi-gateway"
  tailscale_advertise_routes: "{{ lan_subnet }}"
  tailscale_accept_routes: "true"
  tailscale_role: "native"          # native = run on host | container = run in docker
  enable_swap: true
  sysctl_settings:
    net.ipv4.ip_forward: "1"
    net.ipv4.conf.all.forwarding: "1"
    net.ipv4.conf.{{ lan_interface }}.forwarding: "1"
    net.ipv6.conf.all.forwarding: "0"
    net.ipv4.conf.all.send_redirects: "0"
    net.ipv4.conf.default.send_redirects: "0"
    net.ipv4.conf.{{ lan_interface }}.send_redirects: "0"
