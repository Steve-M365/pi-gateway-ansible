---
- name: Install Docker on ARM64
  hosts: gateway
  become: true
  tasks:
    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        install_recommends: false

    - name: Create Docker GPG keyring
      file:
        path: /etc/apt/keyrings/docker.gpg
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/debian/gpg | \
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set Docker repo permissions
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: >-
          deb
          [arch=arm64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        install_recommends: false

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add pi user to docker group
      user:
        name: pi
        groups: docker
        append: true
